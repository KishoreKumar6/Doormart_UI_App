<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="doormartdelivery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>doormartdelivery</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Cashfree JS SDK v3 for Web PG Checkout -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script>
    window.doCashfreeCheckout = function(paymentSessionId, environment) {
      function notify(data) {
        if (window._cashfreeCheckoutCallback) {
          try {
            window._cashfreeCheckoutCallback(typeof data === "string" ? data : JSON.stringify(data));
          } catch(e) {
            console.error("[Cashfree Web] Callback invocation error:", e);
          }
        }
      }

      function execute() {
        try {
          var clean = (environment || "").toString().toLowerCase().trim();
          var mode = (clean === "prod" || clean === "production") ? "production" : "sandbox";
          var cf = window.Cashfree({ mode: mode });
          cf.checkout({
            paymentSessionId: paymentSessionId,
            redirectTarget: "_modal"
          }).then(function(result) {
            console.log("[Cashfree Web] Checkout finished:", result);
            notify(result || { status: "COMPLETED" });
          }).catch(function(err) {
            console.error("[Cashfree Web] Checkout error:", err);
            notify({ error: (err && err.message) || "Payment cancelled or failed" });
          });
        } catch (e) {
          console.error("[Cashfree Web] Execution error:", e);
          notify({ error: (e && e.message) || "Execution error" });
        }
      }

      if (window.Cashfree) {
        execute();
      } else {
        var script = document.createElement("script");
        script.src = "https://sdk.cashfree.com/js/v3/cashfree.js";
        script.onload = execute;
        script.onerror = function() {
          notify({ error: "Unable to load Cashfree JavaScript SDK" });
        };
        document.head.appendChild(script);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
